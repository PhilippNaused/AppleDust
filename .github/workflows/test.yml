name: Test

on:
  workflow_dispatch:
  pull_request:
    branches: main
  push:
    branches: main

env:
  TUNIT_DISABLE_HTML_REPORTER: true # https://tunit.dev/docs/guides/html-report

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - ubuntu-24.04-arm
          - windows-latest
          # - macos-latest
          # - windows-11-arm
    runs-on: ${{ matrix.os }}
    name: Run Tests on ${{ matrix.os }}

    steps:
    - name: ⤵️ Checkout Source
      uses: actions/checkout@v6

    - name: 🕒 Cache NuGet Packages
      uses: actions/cache@v5
      id: cache
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'global.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget

    - name: 🛠️ Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: 🛠️ Restore dependencies
      run: dotnet restore

    - name: 🔨 Build Debug & Release
      run: dotnet build --no-restore --target BuildAll

    - name: 🧪 Test Debug
      run: dotnet test --no-progress --configuration Debug --results-directory ./TestResults --no-build -- --report-trx

    - name: 🧪 Test Release
      run: dotnet test --no-progress --configuration Release --results-directory ./TestResults --no-build -- --report-trx

    - name: 📁 Upload Test Results
      if: (!cancelled())
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}
        path: ./TestResults/*.trx

  publish-results:
    name: Publish Test Results
    needs: test
    runs-on: ubuntu-latest
    if: (!cancelled())

    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write

    steps:
    - name: ⤵️ Download Test Results
      uses: actions/download-artifact@v8
      with:
        pattern: test-results-*
        path: ./TestResults

    - name: 📊 Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: ./TestResults/**/*.trx
